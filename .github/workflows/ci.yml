name: pomogoro CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download 

      - name: Run tests
        run: go test -v ./...

      - name: Build Go binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o pomogoro-linux-amd64 ./cmd/main.go
          GOOS=darwin GOARCH=amd64 go build -o pomogoro-darwin-amd64 ./cmd/main.go
          GOOS=windows GOARCH=amd64 go build -o pomogoro-windows-amd64.exe ./cmd/main.go

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-go-cli-binaries
          path: |
            pomogoro-linux-amd64
            pomogoro-darwin-amd64
            pomogoro-windows-amd64.exe

